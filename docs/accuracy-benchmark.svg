<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0f1930"/><rect x="52" y="52" width="1096" height="526" rx="24" fill="#172440" stroke="#334261"/><text x="92" y="112" fill="#9eabc1" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">OPSPILOT • SYNTHETIC HOLDOUT RESULT</text><text x="92" y="230" fill="#9ff0c9" font-family="Arial" font-size="86" font-weight="700">95.02%</text><text x="92" y="276" fill="#ffffff" font-family="Arial" font-size="25">classification accuracy</text><rect x="92" y="330" width="1016" height="34" rx="17" fill="#263653"/><rect x="92" y="330" width="965" height="34" rx="17" fill="#6c63e8"/><text x="92" y="424" fill="#ffffff" font-family="Arial" font-size="29" font-weight="700">142,530 correct</text><text x="92" y="462" fill="#9eabc1" font-family="Arial" font-size="20">out of 150,000 deterministic labeled events</text><rect x="92" y="505" width="1016" height="1" fill="#334261"/><text x="92" y="545" fill="#d5a553" font-family="Arial" font-size="17">Synthetic validation benchmark — not a production machine-learning claim.</text></svg>
