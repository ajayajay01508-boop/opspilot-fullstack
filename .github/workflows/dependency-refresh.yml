name: Dependency Lock Refresh

on:
  push:
    branches: [main]
    paths:
      - package.json
      - backend/go-processor/go.mod
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: npm install --package-lock-only
      - run: go mod tidy
        working-directory: backend/go-processor
      - name: Emit generated dependency files
        run: |
          printf "GO_MOD:"
          base64 -w0 backend/go-processor/go.mod
          printf "\nGO_SUM:"
          base64 -w0 backend/go-processor/go.sum
          printf "\n"
