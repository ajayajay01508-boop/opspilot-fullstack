services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  php-api:
    build: ./backend/php-api
    environment:
      MONGODB_URI: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports: ["8080:8080"]
    depends_on: [mongo]
  go-processor:
    build: ./backend/go-processor
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports: ["8090:8090"]
    depends_on: [mongo]
volumes:
  mongo_data:
